name: Ops

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  github-config:
    uses: vergil-project/vergil-actions/.github/workflows/ops-github-config.yml@v2.1
    permissions:
      contents: read
      issues: write
    # `inherit` within vergil-project: it carries the App keys from the
    # `automation` environment and any signing or registry secrets the
    # callee declares. Allowed only for the App-key workflows (vrg-validate's
    # secrets-inherit check).
    secrets: inherit

  # The daily audit of agent merges (epic vergil-project/.github#1384). It
  # runs after the config job, but `!cancelled()` keeps a failing config
  # job from skipping it.
  agent-audit:
    needs: github-config
    if: ${{ !cancelled() }}
    uses: vergil-project/vergil-actions/.github/workflows/ops-agent-audit.yml@v2.1
    permissions:
      contents: read
    # `inherit` within vergil-project: it carries the App keys from the
    # `automation` environment and any signing or registry secrets the
    # callee declares. Allowed only for the App-key workflows (vrg-validate's
    # secrets-inherit check).
    secrets: inherit
