name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  actions: read # cd-release@v2.1 evidence harvest downloads the release PR's ci-evidence artifacts
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/cd-docs.yml@v2.1
    permissions:
      contents: write
    # `inherit` within vergil-project: it carries the App keys from the
    # `automation` environment and any signing or registry secrets the
    # callee declares. Allowed only for the App-key workflows (vrg-validate's
    # secrets-inherit check).
    secrets: inherit

  release:
    # Skips the push that creates `main`, which no release PR produced (#4580).
    if: github.ref == 'refs/heads/main' && !github.event.created
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    with:
      language: python
    # `inherit` within vergil-project: it carries the App keys from the
    # `automation` environment and any signing or registry secrets the
    # callee declares. Allowed only for the App-key workflows (vrg-validate's
    # secrets-inherit check).
    secrets: inherit
