name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  actions: read # cd-release@v2.1 evidence harvest downloads the release PR's ci-evidence artifacts
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/cd-docs.yml@v2.1
    permissions:
      contents: write
    # `inherit` is required: the automation App keys live in the `automation`
    # environment, and environment secrets reach a cross-repo reusable
    # workflow only under `secrets: inherit` (vergil-project/packages#6).
    # Allowed only for the App-key workflows (vrg-validate's secrets-inherit
    # check). The nosemgrep stays until the vergil-tooling release that
    # excludes semgrep's secrets-inherit rule, which that check replaces.
    secrets: inherit  # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit

  release:
    # Skips the push that creates `main`, which no release PR produced (#4580).
    if: github.ref == 'refs/heads/main' && !github.event.created
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    with:
      language: python
    # `inherit` is required: environment secrets reach a job in a cross-repo
    # reusable workflow only when the caller uses `secrets: inherit` (probe in
    # vergil-project/packages#6). With an explicit map, cd-release's
    # package-sign job sees an empty PACKAGE_SIGNING_KEY from its
    # `package-signing` environment. The callee is first-party (same org); it
    # also uses APP_CLIENT_ID / APP_PRIVATE_KEY for the package-released
    # dispatch (spec §8.2), read from the `automation` environment.
    secrets: inherit  # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
