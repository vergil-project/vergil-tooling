[project]
repository-type = "tooling"
versioning-scheme = "semver"
branching-model = "library-release"
release-model = "tagged-release"
primary-language = "python"
[publish]
release = true
docs = true
consumer-refresh = """\
# Reinstall the host tools at the just-released version
uv tool install --python 3.14 'vergil-tooling @ git+https://github.com/vergil-project/vergil-tooling@v<VERSION>'
# Refresh all dev VMs
vrg-vm update --all
"""

[ci]
versions = ["3.12", "3.13", "3.14"]
integration-tests = false

[dependencies]
vergil = "v2.1"

# Publish vergil-tooling as a signed .deb/.rpm (epic vergil-project/.github#356).
# The python builder installs the venv from uv.lock at
# /opt/vergil/vergil-tooling/venv against the packaged vergil-python runtime,
# shims every [project.scripts] command into /usr/bin, and is built and
# install-tested on every default target (docs/site/docs/reference/package-config.md).
[package]
builder = "python"
vendor = "vergil"
summary = "Shared development tooling for Vergil-managed repositories"
smoke = "vrg-whoami --mode"

[package.python]
# The released, indexed vergil-python patch (vergil-project/vergil-python#2).
runtime = "3.14.8"

# This repo dogfoods its own unreleased code: the cached dev image deliberately
# skips `uv tool install` for the self-repo, so `vrg-validate` is not on PATH —
# `uv run` activates the project venv instead. Declaring it here (rather than
# only in CLAUDE.md) lets vrg-container-run resolve the correct command from the
# target repo, so cross-repo agents validate this repo correctly regardless of
# where their session started (issue #1433).
[validation]
container-command = "uv run vrg-validate"
