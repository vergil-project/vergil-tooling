[project]
# "tooling", not "library": since epic vergil-project/.github#1256 every install
# path runs vergil-tooling on its own Python 3.15 interpreter (the package on
# vergil-python 3.15, git installs with --python 3.15 or on the core Python, the
# self-repo sync on 3.15), so no consumer runs it on a window version it builds.
# That removes the reason epic vergil-project/.github#407 made it a library. It
# resolves as an app and builds the newest window version with a published
# runtime; when a newer series gets one, CI moves to it (fail forward), and a
# pin back to 3.15 would be a deliberate, tracked exception.
repository-type = "tooling"
versioning-scheme = "semver"
branching-model = "library-release"
release-model = "tagged-release"
primary-language = "python"
[publish]
release = true
docs = true
# The Mac installs the exact release tag (immutable, so no ls-remote and no
# SHA), constrained by that tag's own uv.lock, on uv's managed 3.15, with no uv
# config file or interpreter variable able to change it (epic
# vergil-project/.github#1350, spec §4.1, §4.2 and §4.5). Plain shell on
# purpose: nothing runs vergil-tooling to install vergil-tooling. The same
# lines are the documented first install (docs/site/docs/getting-started.md).
consumer-refresh = """\
# Reinstall the host tools at the just-released version, locked to its uv.lock
(
  set -euo pipefail
  unset UV_PYTHON UV_PYTHON_PREFERENCE UV_NO_MANAGED_PYTHON
  tmp="$(mktemp -d)"
  trap 'rm -rf "$tmp"' EXIT
  git init -q "$tmp/src"
  git -C "$tmp/src" fetch -q --depth 1 https://github.com/vergil-project/vergil-tooling refs/tags/v<VERSION>
  git -C "$tmp/src" checkout -q FETCH_HEAD
  (cd "$tmp/src" && uv export --no-config --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt -o "$tmp/constraints.txt" >/dev/null)
  uv tool install --force --no-config --python 3.15 --managed-python -c "$tmp/constraints.txt" "vergil-tooling @ git+https://github.com/vergil-project/vergil-tooling@v<VERSION>"
)
# Refresh all dev VMs
vrg-vm update --all
"""

[ci]
integration-tests = false

[dependencies]
vergil = "v2.1"

# The merge-review documentation allow-list (vrg-change-class): a change that
# only adds or edits files below these directories is classed docs-only.
# docs/site/ itself is deliberately absent: it holds mkdocs.yml, which
# controls the site build, so a change to it stays code.
[merge-review]
docs-paths = ["docs/site/docs/", "docs/specs/"]

# Publish vergil-tooling as a signed .deb/.rpm (epic vergil-project/.github#356).
# The python builder installs the venv from uv.lock at
# /opt/vergil/vergil-tooling/venv against the packaged vergil-python runtime,
# shims every [project.scripts] command into /usr/bin, and is built and
# install-tested on every default target (docs/site/docs/reference/package-config.md).
# There is no [package.python].runtime pin: the runtime is derived as the newest
# resolved version with a published runtime, and the package installs and
# depends on the per-series vergil-python<x.y> (vergil-tooling#3455).
[package]
builder = "python"
vendor = "vergil"
summary = "Shared development tooling for Vergil-managed repositories"
smoke = "vrg-whoami --mode"

# This repo dogfoods its own unreleased code: the cached dev image deliberately
# skips `uv tool install` for the self-repo, so `vrg-validate` is not on PATH —
# `uv run` activates the project venv instead. Declaring it here (rather than
# only in CLAUDE.md) lets vrg-container-run resolve the correct command from the
# target repo, so cross-repo agents validate this repo correctly regardless of
# where their session started (issue #1433).
[validation]
container-command = "uv run vrg-validate"
