[changelog]
header = ""
# Pasted subjects and bodies go through replace_regex: a line that starts with a
# MkDocs snippets marker (dashes, `8<`, dashes) has its first dash written as
# the HTML entity &#45;, so it renders as the same text and is never expanded.
# The R flag makes a lone carriage return start a line too, as Markdown reads it.
body = """{% if version -%}
    # Release {{ version | trim_start_matches(pat="develop-v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
    # Unreleased
{% endif %}{% for group, commits in commits | group_by(attribute="group") %}
    ## {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - **{{ commit.message | split(pat="\n") | first | trim | replace_regex(from="(?mR)^([ \t]*;*)-(-*8<)", to="${1}&#45;${2}") }}**\
          {% if commit.body %}
          {{ commit.body | trim | replace_regex(from="(?mR)^([ \t]*;*)-(-*8<)", to="${1}&#45;${2}") }}
          {% endif -%}
    {% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat[(:!]", group = "Features" },
  { message = "^fix[(:!]", group = "Bug fixes" },
  { message = "^docs[(:!]", group = "Documentation" },
  { message = "^perf[(:!]", group = "Performance" },
  { message = "^refactor[(:!]", group = "Refactoring" },
  { message = "^style[(:!]", group = "Styling" },
  { message = "^test[(:!]", group = "Testing" },
  { message = "^build[(:!]", group = "Build" },
  { message = "^ci[(:!]", group = "CI" },
  { message = "^revert[(:!]", group = "Reverts" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore[(:!]", group = "Chores" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "develop-v[0-9].*"
skip_tags = ""
sort_commits = "oldest"
