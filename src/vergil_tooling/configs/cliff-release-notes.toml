[changelog]
header = ""
# Pasted subjects and bodies go through replace_regex: a line that starts with a
# MkDocs snippets marker (dashes, `8<`, dashes) has its first dash written as
# the HTML entity &#45;, so it renders as the same text and is never expanded.
# The R flag makes a lone carriage return start a line too, as Markdown reads it.
# A commit body is its list item's description: each of its non-blank lines is
# indented two spaces, so it belongs to the item, and the list stays tight
# (vergil-project/vergil-tooling#4553). A body of several paragraphs makes its
# item loose, so a blank line follows it unless it ends the list, as Prettier
# writes it.
body = """{% if version -%}
    # Release {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
    # Unreleased
{% endif %}{% for group, commits in commits | group_by(attribute="group") %}
    ## {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - **{{ commit.message | split(pat="\n") | first | trim | replace_regex(from="(?mR)^([ \t]*;*)-(-*8<)", to="${1}&#45;${2}") }}**\
          {% if commit.body %}
          {% set body = commit.body | trim | replace_regex(from="(?mR)^([ \t]*;*)-(-*8<)", to="${1}&#45;${2}") -%}
          {{ body | replace_regex(from="(?mR)^([ \t]*[^ \t\r\n])", to="  ${1}") }}\
          {% if not loop.last and body is matching("\\n[ \\t]*\\n") %}
          {% endif %}\
          {% endif -%}
    {% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# A merge commit's subject is one git or GitHub wrote ("Merge pull request #N
# from ...", "Merge branch 'x'"), never a conventional one, and its changes are
# the commits it merges, which are in the range and listed on their own. Left
# as it is, git-cliff fails to parse it and warns that it skipped the commit
# (vergil-project/vergil-tooling#4592). The preprocessor gives such a subject a
# `merge` type, and the first parser skips it on purpose, without a warning. A
# hand-written subject that is not conventional still warns.
commit_preprocessors = [
  { pattern = "^(Merge (pull request #[0-9]+ from|branch|branches|remote-tracking branch|tag|commit) )", replace = "merge: $1" },
]
commit_parsers = [
  { message = "^merge: Merge ", skip = true },
  { message = "^feat[(:!]", group = "Features" },
  { message = "^fix[(:!]", group = "Bug fixes" },
  { message = "^docs[(:!]", group = "Documentation" },
  { message = "^perf[(:!]", group = "Performance" },
  { message = "^refactor[(:!]", group = "Refactoring" },
  { message = "^style[(:!]", group = "Styling" },
  { message = "^test[(:!]", group = "Testing" },
  { message = "^build[(:!]", group = "Build" },
  { message = "^ci[(:!]", group = "CI" },
  { message = "^revert[(:!]", group = "Reverts" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore[(:!]", group = "Chores" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
skip_tags = ""
sort_commits = "oldest"
