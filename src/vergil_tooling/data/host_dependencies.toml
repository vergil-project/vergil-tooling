# macOS host-dependency manifest for vrg-host (epic vergil-project/.github#167).
#
# Tooling-owned. NEVER repo-overridable (spec §10): this file is read only
# from the installed vergil_tooling.data package, and any `custom` probe
# commands it carries are trusted, tooling-authored content.
#
# Scope (spec §4): a tool earns an entry only if Vergil development needs it
# on the macOS host itself. The list was curated (plan Task 7, spec §11) by
# cross-checking what vergil-tooling actually invokes host-side: vrg-container-run
# (docker), vrg-vm (limactl, gcloud, tofu), vrg-release (git-cliff), vrg-gh and
# the PR workflow (gh), git and bash throughout, and the documented host
# prerequisites (Docker, uv, gh). #3300 added git, bash, the Xcode Command Line
# Tools and Claude Code after the first real `vrg-host upgrade --all` showed
# they were missing.
#
# Deliberately OUT, with the reason:
#   - shellcheck, hadolint, yamllint, actionlint, markdownlint: run only by
#     vrg-validate inside the dev container (vrg-container-run); the host never
#     invokes them, and the setup guides say not to install them on the host.
#   - ssh, ssh-keygen, sysctl, PlistBuddy: part of macOS, updated with the OS
#     (see the `macos` entry). git and bash used to be listed here as well, but
#     on a Homebrew-first host both resolve to Homebrew formulae ahead of the
#     Apple copies (/opt/homebrew/bin/git before /usr/bin/git, Homebrew bash 5
#     before /bin/bash 3.2), so the binaries that actually run are NOT updated
#     with the OS and have their own entries (#3300).
#   - jq: used only by the hook-guard shim's fallback when vergil-tooling is
#     absent; macOS ships /usr/bin/jq.
#   - az (Azure CLI): needed only by `vrg-vm --provider azure`, an optional
#     alternate cloud provider; gcp is the provider in use. Add an entry if
#     Azure becomes a working provider on this host.
#   - nfpm, npm, language toolchains: container / CI only (vrg-package,
#     vrg-validate), never host-side.
#   - Homebrew itself: the install mechanism for the brew-formula entries, not a
#     Vergil dependency; it keeps its own metadata fresh via auto-update.
#   - Editors, voice-to-text and other personal tools (spec §4). Claude Code
#     was on this list until #3300 deliberately reversed that; see its entry.
#   - Full Xcode: nothing on the host needs more than the Command Line Tools
#     (the `xcode-clt` entry).
#
# Method assumptions: each entry's `method` reflects the documented install
# path (setup guides, specs). A tool installed some other way on a given host
# reads as `missing` for brew/uv methods, never as a false `current`. The methods
# were verified against a live macOS host on 2026-10-16 (#3261; captured probe
# output under tests/vergil_tooling/fixtures/host/).

# uv: installed with Homebrew on the macOS host (`uv --version` prints
# "(Homebrew …)"). Homebrew builds have no `uv self update`, so Homebrew owns
# the lifecycle. Latest is Homebrew's stable version, which can trail Astral's
# newest release by a few days (0.13.0 vs 0.13.1 at capture); that lag is
# accepted in exchange for a single install path.
[[dependency]]
name = "uv"
why = "Python tool manager; installs and upgrades the vrg-* host tools (vergil-tooling)."
method = "brew-formula"
upgrade = "auto"
latest = "probe"

[[dependency]]
name = "gh"
why = "GitHub CLI; underpins vrg-gh and all PR/issue workflows."
method = "brew-formula"
upgrade = "auto"
latest = "probe"

# git: vergil-tooling runs `git` host-side throughout (lib/git.py: vrg-git,
# vrg-commit, vrg-submit-pr, vrg-finalize-pr, vrg-release, worktrees). On the
# macOS host it resolves to Homebrew's /opt/homebrew/bin/git ahead of the
# Apple's /usr/bin/git shim (git 2.54.0 at capture, 2026-10-16, #3300), so
# Homebrew owns the copy that runs.
[[dependency]]
name = "git"
why = "Git; vrg-git, vrg-commit, vrg-submit-pr, vrg-finalize-pr, vrg-release and the worktree workflow run it on the host (Homebrew's git, ahead of /usr/bin/git)."
method = "brew-formula"
upgrade = "auto"
latest = "probe"

# bash: the host-side vrg-* tools and the hook-guard shim run `bash`. On the
# macOS host it resolves to Homebrew's bash 5 (/opt/homebrew/bin/bash) ahead
# of Apple's /bin/bash 3.2, which Apple never moves past 3.2 (bash 5.3.9 at
# capture, 2026-10-16, #3300).
[[dependency]]
name = "bash"
why = "Bash; the host-side vrg-* tools and the hook-guard shim run it (Homebrew's bash 5, ahead of Apple's /bin/bash 3.2)."
method = "brew-formula"
upgrade = "auto"
latest = "probe"

# gcloud's installed and latest versions are both read from its `core`
# component, so the two compare in the same (date-stamped) version scheme;
# the SDK release number `gcloud version` prints first is a different scheme.
#
# Install vs. update (verified on a live host, #3261): gcloud is installed from
# the Homebrew `gcloud-cli` cask, but the SDK's own component manager owns its
# updates. The cask is `auto_updates`, and Homebrew's recorded version goes
# stale as the SDK self-updates (brew showed 573.0.0 while the SDK was at
# 587.0.0), so this stays a `custom` entry. The SDK root
# (/opt/homebrew/share/google-cloud-sdk) is user-owned, so `gcloud components
# update` needs no privilege. Never upgrade it with `brew upgrade --greedy`.
#
# Check numpy-in-interpreter (absorbs vergil-project/.github#166): gcloud's
# IAP tunnel imports numpy from the interpreter gcloud itself runs on (on a
# Homebrew install, its managed virtualenv). Without it every IAP session
# prints an "install NumPy" warning and the tunnel is slower. The remediation
# pip-installs numpy into that interpreter, unprivileged; an externally
# managed (PEP 668) interpreter makes pip refuse, which vrg-host reports as a
# failed remediation rather than working around it.
[[dependency]]
name = "gcloud"
why = "Google Cloud CLI; IAP tunnel for vrg-vm cloud sessions. Installed from the gcloud-cli cask but self-updating through its component manager: never upgrade it with `brew upgrade --greedy`."
method = "custom"
upgrade = "auto"
latest = "probe"

[dependency.probes]
installed_version = ["gcloud", "version", "--format=value(core)"]
latest_version = [
  "gcloud", "components", "list", "--filter=id=core", "--format=value(latest_version_string)",
]
upgrade = ["gcloud", "components", "update", "--quiet"]

[[dependency.check]]
name = "numpy-in-interpreter"
probe = [
  "bash", "-c",
  "py=\"$(gcloud info --format='value(basic.python_location)')\" && [ -n \"$py\" ] && exec \"$py\" -c 'import numpy'",
]
remediation = [
  "bash", "-c",
  "py=\"$(gcloud info --format='value(basic.python_location)')\" && [ -n \"$py\" ] && exec \"$py\" -m pip install --disable-pip-version-check numpy",
]

# Lima: vrg-vm drives local agent VMs through limactl. Upgrading the formula
# under running VMs is safe for the VMs themselves; a running instance keeps
# its old host agent until it is next restarted.
[[dependency]]
name = "lima"
why = "Lima (limactl) runs the local agent VMs that vrg-vm creates and enters."
method = "brew-formula"
upgrade = "auto"
latest = "probe"

# Docker Desktop: vrg-container-run / vrg-container-test exec the `docker` CLI
# for every validation run, and Docker Desktop provides that CLI and the engine
# behind it. The entry tracks the Desktop app, not the CLI (the CLI version,
# e.g. 29.4.1, is not the Desktop release, e.g. 4.71.0).
#
# - Installed: the app's own Info.plist (CFBundleShortVersionString). Desktop
#   updates itself, so Homebrew's recorded cask version goes stale; the plist
#   is what is actually installed. It needs no running daemon.
# - Latest: the `docker-desktop` cask's version (`4.94.0,241994` reads as
#   4.94.0; the `,<build>` part is dropped).
# - Upgrade: `manual`. Desktop's own updater applies updates and may install
#   privileged helpers, and vrg-host never escalates. The cask is
#   `auto_updates`, so brew must not upgrade it either.
#
# Tracking Desktop is an artifact of the Docker Desktop choice, not of Docker:
# moving to a headless/OSS engine (Colima, podman, or docker-engine over the
# Lima already installed) would make this an `auto` brew-formula entry. That
# migration is out of scope here and is a designated topic for the epic's
# follow-on brainstorm (vergil-project/.github#169).
[[dependency]]
name = "docker-desktop"
why = "Docker Desktop: the container engine and docker CLI that vrg-container-run execs for every dev-container run. Updated through Desktop's own updater, never by vrg-host."
method = "brew-cask"
upgrade = "manual"
latest = "probe"

[dependency.probes]
installed_version = [
  "defaults", "read", "/Applications/Docker.app/Contents/Info.plist", "CFBundleShortVersionString",
]

# OpenTofu: vrg-vm's cloud path provisions VMs with `tofu` and its preflight
# requires >= 1.8.0. The Homebrew formula is `opentofu`; its binary is `tofu`.
[[dependency]]
name = "opentofu"
why = "OpenTofu (tofu) provisions the cloud agent VMs for vrg-vm; preflight requires >= 1.8.0."
method = "brew-formula"
upgrade = "auto"
latest = "probe"

[[dependency]]
name = "git-cliff"
why = "Changelog generator that vrg-release requires on the host (release preflight)."
method = "brew-formula"
upgrade = "auto"
latest = "probe"

# vergil-tooling (the vrg-* tools): installed host-side with
# `uv tool install 'vergil-tooling @ git+…@v<line>'` and upgraded within the
# pinned release line with `uv tool upgrade vergil-tooling` (the documented
# host upgrade). Its latest is `unmanaged`: it is git-sourced, so uv's
# `--outdated` feed (a package index) cannot see new releases, and reading
# "not listed as outdated" as current would be a silent false `current`.
[[dependency]]
name = "vergil-tooling"
why = "The vrg-* host tools themselves (vrg-container-run, vrg-commit, vrg-vm, vrg-host, …)."
method = "uv-tool"
upgrade = "auto"
latest = "unmanaged"

# Claude Code: the host-side agent for out-of-sandbox work, for example
# reattaching an agent session on the Mac with human access (Appendix A of the
# #167 retrospective). The tooling never runs `claude` itself. The #167 spec
# (§4) excluded Claude Code as a personal tool; #3300 deliberately reverses
# that, because the maintainer's workflow depends on it on the host.
#
# Installed from the Homebrew `claude-code` cask (~/.local/bin/claude is a
# symlink to /opt/homebrew/bin/claude; 2.1.280 at capture, 2026-10-16, #3300).
# Upgrade is `auto`: the cask does NOT declare `auto_updates` (the Homebrew API,
# https://formulae.brew.sh/api/cask/claude-code.json, returned
# "auto_updates": null on 2026-10-16, cask version 2.1.292), so Homebrew owns
# its updates and `brew upgrade --cask claude-code` is the upgrade. vrg-host
# re-reads `auto_updates` before every cask upgrade and refuses if the cask
# ever becomes self-updating; the entry must then become `manual`.
[[dependency]]
name = "claude-code"
why = "Claude Code; the host-side agent used for out-of-sandbox work, such as reattaching an agent session on the Mac with human access."
method = "brew-cask"
upgrade = "auto"
latest = "probe"

# macOS itself: reported, never applied (spec §4, §6). Software Update can
# offer several macOS updates at once (an update within the current major and
# the next major, #3269), so the probe is `latest_versions`: it parses
# `softwareupdate --list` (unprivileged, read-only) and prints the Version of
# every listed macOS update, one per line, and `status` reports each level
# (patch / minor / major) that is behind. A macOS title whose Version cannot
# be extracted is printed as-is, so vrg-host reports a probe error instead of
# dropping the offer. When Software Update answers but lists no macOS update
# it prints the installed version (nothing newer: current). Any other output
# fails the probe, so it reports latest-unknown instead of a false `current`.
[[dependency]]
name = "macos"
why = "The host OS; a pending macOS update is surfaced so it is applied deliberately, never by vrg-host."
method = "custom"
upgrade = "manual"
latest = "probe"

[dependency.probes]
installed_version = ["sw_vers", "-productVersion"]
latest_versions = [
  "bash", "-c",
  '''
out="$(softwareupdate --list 2>&1)" || exit 1
offers="$(printf '%s\n' "$out" | awk '
  /^[[:space:]]*Title: macOS/ {
    version = ""
    if (match($0, /, Version: [^,]*,/)) version = substr($0, RSTART + 11, RLENGTH - 12)
    if (version ~ /^[[:space:]]*$/) print "unreadable macOS offer: " $0
    else print version
  }')" || exit 1
if [ -n "$offers" ]; then
  printf '%s\n' "$offers"
elif printf '%s\n' "$out" | grep -qE 'No new software available|Software Update found the following'; then
  sw_vers -productVersion
else
  exit 1
fi
''',
]

# Xcode Command Line Tools: an implicit host dependency. Homebrew needs the
# CLT (compilers, headers) to work at all, even on a Mac that also has full
# Xcode installed. Apple's /usr/bin tool shims (git, clang, ...) run whichever
# developer directory `xcode-select -p` selects: the CLT, or Xcode.app's own
# toolchain (the maintainer's host selects Xcode.app, 2026-10-16). Full Xcode
# is updated by the App Store and is not tracked here.
# Apple ships CLT updates through Software Update, separately from macOS, so
# this is a report-only entry modelled on `macos`: reported, never applied.
#
# - Installed: `pkgutil --pkg-info=com.apple.pkg.CLTools_Executables` prints
#   `version: 26.6.0.0.1781586589` (captured 2026-10-16, #3300). The trailing
#   `.0.<build>` part is a build stamp that Software Update never shows, so the
#   probe keeps only the first three components (26.6.0). That compares
#   directly with Software Update's `Version: 26.6` (missing components are 0)
#   and reports a real update (26.6.1, 26.7, 27.0) at its proper level. A
#   pkgutil answer without exactly one dotted-numeric version line prints a
#   fixed message with no version in it, so vrg-host reports a probe error
#   rather than fishing a version out of it. When the package receipt is
#   absent, pkgutil fails and the CLT reads as `missing` (ERROR), since
#   Homebrew cannot work without it.
# - Latest: `latest_versions`, parsing every "Command Line Tools" item that
#   `softwareupdate --list` (unprivileged, read-only) lists, the same rules as
#   `macos`: an item whose Version cannot be extracted is printed as-is, so it
#   is a probe error, never dropped. When Software Update answers but lists no
#   CLT item, the CLT is current and the probe prints the installed version.
#   Any other output fails the probe (latest-unknown, never a false current).
#   A listed item that is not newer than the installed version is ignored,
#   like any other offer that is not an update.
[[dependency]]
name = "xcode-clt"
why = "Xcode Command Line Tools; Homebrew needs them (compilers, headers), even when full Xcode is installed. A pending update is surfaced so it is applied deliberately, never by vrg-host."
method = "custom"
upgrade = "manual"
latest = "probe"

[dependency.probes]
installed_version = [
  "bash", "-c",
  '''
out="$(pkgutil --pkg-info=com.apple.pkg.CLTools_Executables)" || exit 1
printf '%s\n' "$out" | awk '
  /^version: / { count++; version = $2 }
  END {
    if (count == 1 && version ~ /^[0-9]+(\.[0-9]+)*$/) {
      n = split(version, part, ".")
      printf "%s", part[1]
      for (i = 2; i <= n && i <= 3; i++) printf ".%s", part[i]
      printf "\n"
    } else {
      print "unreadable pkgutil CLTools_Executables version"
    }
  }'
''',
]
latest_versions = [
  "bash", "-c",
  '''
clt_version() {
  pkg="$(pkgutil --pkg-info=com.apple.pkg.CLTools_Executables)" || return 1
  printf '%s\n' "$pkg" | awk '
    /^version: / { count++; version = $2 }
    END {
      if (count == 1 && version ~ /^[0-9]+(\.[0-9]+)*$/) {
        n = split(version, part, ".")
        printf "%s", part[1]
        for (i = 2; i <= n && i <= 3; i++) printf ".%s", part[i]
        printf "\n"
      } else {
        print "unreadable pkgutil CLTools_Executables version"
      }
    }'
}
out="$(softwareupdate --list 2>&1)" || exit 1
offers="$(printf '%s\n' "$out" | awk '
  /^[[:space:]]*Title: Command Line Tools/ {
    version = ""
    if (match($0, /, Version: [^,]*,/)) version = substr($0, RSTART + 11, RLENGTH - 12)
    if (version ~ /^[[:space:]]*$/) print "unreadable Command Line Tools offer: " $0
    else print version
  }')" || exit 1
if [ -n "$offers" ]; then
  printf '%s\n' "$offers"
elif printf '%s\n' "$out" | grep -qE 'No new software available|Software Update found the following'; then
  clt_version
else
  exit 1
fi
''',
]
